app = "osh-agriculture-ai-global"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[processes]
  web = "uvicorn app.main:app --host 0.0.0.0 --port 8080"
  worker = "python -m app.worker"

[deploy]
  release_command = "python -m app.init_db"

[http_service]
  internal_port = 8080
  force_https = true
  processes = ["web"]
  auto_stop_machines = "off"
  auto_start_machines = false

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/v1/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
