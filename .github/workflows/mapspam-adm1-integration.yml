name: MAPSPAM ADM hierarchy integration smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/app/run_global_mapspam.py"
      - "backend/app/run_global_mapspam_hierarchy.py"
      - "backend/app/import_mapspam_hierarchy.py"
      - "backend/app/services/global_raster_batch.py"
      - "backend/app/services/global_raster_catalog.py"
      - "backend/app/services/boundaries.py"
      - "backend/app/sync_global_rasters.py"
      - "scripts/verify_uzb_adm1_mapspam.py"
      - "scripts/verify_uzb_adm1_vs_adm0.py"
      - "backend/app/models.py"
      - "backend/app/db.py"
      - "backend/app/main.py"
      - "backend/app/import_mapspam_results.py"
      - "tests/test_global_raster_import.py"
      - ".github/workflows/mapspam-adm1-integration.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/app/run_global_mapspam.py"
      - "backend/app/run_global_mapspam_hierarchy.py"
      - "backend/app/import_mapspam_hierarchy.py"
      - "backend/app/services/global_raster_batch.py"
      - "backend/app/services/global_raster_catalog.py"
      - "backend/app/services/boundaries.py"
      - "backend/app/sync_global_rasters.py"
      - "scripts/verify_uzb_adm1_mapspam.py"
      - "scripts/verify_uzb_adm1_vs_adm0.py"
      - "backend/app/models.py"
      - "backend/app/db.py"
      - "backend/app/main.py"
      - "backend/app/import_mapspam_results.py"
      - "tests/test_global_raster_import.py"
      - ".github/workflows/mapspam-adm1-integration.yml"

permissions:
  contents: read

jobs:
  uzb-adm1-mapspam:
    name: Real MAPSPAM UZB ADM1-ADM2 integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: backend
      MAPSPAM_DATA_DIR: .ci-mapspam-data
      MAPSPAM_OUTPUT_DIR: .ci-mapspam-output
      MAPSPAM_ADM0_OUTPUT_DIR: .ci-mapspam-adm0-output
      MAPSPAM_ADM2_OUTPUT_DIR: .ci-mapspam-adm2-output

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install raster and backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download and validate official MAPSPAM core rasters
        run: |
          python -m app.sync_global_rasters \
            --dataset mapspam \
            --data-dir "$MAPSPAM_DATA_DIR"

      - name: Calculate all crops for Uzbekistan ADM1 zones
        run: |
          python -m app.run_global_mapspam \
            --level ADM1 \
            --countries UZB \
            --technology all \
            --data-dir "$MAPSPAM_DATA_DIR" \
            --output-dir "$MAPSPAM_OUTPUT_DIR" \
            --resume

      - name: Calculate official Uzbekistan ADM0 country totals
        run: |
          python -m app.run_global_mapspam \
            --level ADM0 \
            --countries UZB \
            --technology all \
            --data-dir "$MAPSPAM_DATA_DIR" \
            --output-dir "$MAPSPAM_ADM0_OUTPUT_DIR" \
            --resume

      - name: Calculate Uzbekistan ADM2 district summaries with parent links
        run: |
          python -m app.run_global_mapspam_hierarchy \
            --level ADM2 \
            --countries UZB \
            --technology all \
            --data-dir "$MAPSPAM_DATA_DIR" \
            --output-dir "$MAPSPAM_ADM2_OUTPUT_DIR" \
            --resume

      - name: Validate ADM1-to-ADM2 hierarchy conservation
        run: |
          python -m app.import_mapspam_hierarchy \
            --parent-level ADM1 \
            --child-level ADM2 \
            --parent-csv "$MAPSPAM_OUTPUT_DIR/mapspam_2020_adm1.csv" \
            --child-csv "$MAPSPAM_ADM2_OUTPUT_DIR/mapspam_2020_adm2.csv" \
            --dry-run

      - name: Verify 14 zones x 46 crops output
        run: |
          python scripts/verify_uzb_adm1_mapspam.py \
            "$MAPSPAM_OUTPUT_DIR/mapspam_2020_adm1.csv" \
            "$MAPSPAM_OUTPUT_DIR/mapspam_2020_adm1_errors.csv"

      - name: Compare ADM1 sums with ADM0 country totals
        run: |
          python scripts/verify_uzb_adm1_vs_adm0.py \
            "$MAPSPAM_OUTPUT_DIR/mapspam_2020_adm1.csv" \
            "$MAPSPAM_ADM0_OUTPUT_DIR/mapspam_2020_adm0.csv"

      - name: Validate database import against real MAPSPAM outputs (dry-run)
        run: |
          python -m app.import_mapspam_results \
            --adm1-csv "$MAPSPAM_OUTPUT_DIR/mapspam_2020_adm1.csv" \
            --adm0-csv "$MAPSPAM_ADM0_OUTPUT_DIR/mapspam_2020_adm0.csv" \
            --dry-run

      - name: Upload real-data integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uzb-adm1-adm2-mapspam-results
          if-no-files-found: ignore
          path: |
            .ci-mapspam-output/mapspam_2020_adm1.csv
            .ci-mapspam-output/mapspam_2020_adm1_errors.csv
            .ci-mapspam-output/mapspam_2020_adm1_completed.json
            .ci-mapspam-adm0-output/mapspam_2020_adm0.csv
            .ci-mapspam-adm0-output/mapspam_2020_adm0_errors.csv
            .ci-mapspam-adm2-output/mapspam_2020_adm2.csv
            .ci-mapspam-adm2-output/mapspam_2020_adm2_errors.csv
            .ci-mapspam-adm2-output/mapspam_2020_adm2_completed.json
