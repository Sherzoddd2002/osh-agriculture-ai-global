name: Capture public demo preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-preview-capture
  cancel-in-progress: false

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tools
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow "fastapi>=0.115,<1" "httpx>=0.27,<1" "shapely>=2.0,<3"
          playwright install --with-deps chromium
      - name: Build the same ADM bundle as GitHub Pages
        run: |
          python scripts/build_public_boundaries.py
          python scripts/build_public_global_boundaries.py
      - name: Assemble latest public homepage
        run: python scripts/assemble_public_frontend.py
      - name: Run public site checks before preview
        run: python scripts/check_public_site.py
      - name: Capture screenshots and GIF
        run: python scripts/capture_demo_gif.py
      - name: Commit generated preview assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/osh-global-preview.png docs/assets/demo-walkthrough.gif
          if git diff --cached --quiet; then
            echo "Preview assets unchanged."
          else
            git commit -m "Refresh public data dashboard screenshot and walkthrough GIF"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "main moved during preview upload; retrying attempt $attempt of 5"
            done
            echo "Could not push preview assets after five attempts."
            exit 1
          fi
