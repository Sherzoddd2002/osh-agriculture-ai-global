name: Capture public demo preview

on:
  push:
    branches:
      - feat/global-3d-globe-dark
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/global-3d-globe-dark
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tools
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow
          playwright install --with-deps chromium
      - name: Capture screenshots and GIF
        run: python scripts/capture_demo_gif.py
      - name: Commit generated preview assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/osh-global-preview.png docs/assets/demo-walkthrough.gif
          if git diff --cached --quiet; then
            echo "Preview assets unchanged."
          else
            git commit -m "Add public demo screenshot and walkthrough GIF"
            git push origin HEAD:feat/global-3d-globe-dark
          fi
