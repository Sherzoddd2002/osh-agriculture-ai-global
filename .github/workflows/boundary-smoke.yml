name: Verify Uzbekistan administrative boundaries

on:
  push:
    branches: [main]
    paths:
      - "backend/app/services/boundaries.py"
      - "backend/app/config.py"
      - "docs/index.html"
      - "scripts/verify_live_boundaries.py"
      - ".github/workflows/boundary-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uzb-boundaries:
    name: Live geoBoundaries UZB ADM1 and ADM2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install boundary adapter dependencies
        run: python -m pip install "fastapi>=0.115,<1" "httpx>=0.27,<1" "shapely>=2.0,<3"
      - name: Verify live UZB ADM1 and ADM2 boundaries
        run: python scripts/verify_live_boundaries.py
