name: Deploy public demo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-public-demo-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up Python for static data packaging
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install boundary validation dependencies
        run: python -m pip install "fastapi>=0.115,<1" "httpx>=0.27,<1" "shapely>=2.0,<3"
      - name: Build and validate Uzbekistan ADM1/ADM2 GeoJSON
        run: python scripts/build_public_boundaries.py
      - name: Check Python build scripts
        run: python -m py_compile scripts/build_public_boundaries.py scripts/check_public_site.py
      - name: Check public dashboard and JavaScript
        run: python scripts/check_public_site.py
      - name: Upload static demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
