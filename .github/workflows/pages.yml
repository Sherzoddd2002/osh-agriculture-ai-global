name: Deploy public demo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows: ["MAPSPAM ADM hierarchy integration smoke"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-public-demo-v2
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up Python for static data packaging
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install boundary validation dependencies
        run: python -m pip install "fastapi>=0.115,<1" "httpx>=0.27,<1" "shapely>=2.0,<3"
      - name: Build and validate Uzbekistan ADM1/ADM2 GeoJSON
        run: python scripts/build_public_boundaries.py
      - name: Locate latest successful UZB MAPSPAM artifact
        id: mapspam
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "mapspam-adm1-integration.yml",
              branch: "main",
              status: "success",
              per_page: 10
            });
            const run = runs.data.workflow_runs.find(item => item.head_branch === "main");
            if (!run) {
              core.setOutput("available", "false");
              core.info("No successful MAPSPAM validation run found; preserving any published snapshot.");
              return;
            }
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100
            });
            const artifact = artifacts.data.artifacts.find(item =>
              item.name === "uzb-adm1-adm2-mapspam-results" && !item.expired
            );
            if (!artifact) {
              core.setOutput("available", "false");
              core.info("Latest successful MAPSPAM run has no available result artifact; preserving any published snapshot.");
              return;
            }
            core.setOutput("available", "true");
            core.setOutput("run-id", String(run.id));
            core.info(`Using MAPSPAM validation run ${run.id} at ${run.head_sha}`);
      - name: Download validated Uzbekistan MAPSPAM data
        if: steps.mapspam.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: uzb-adm1-adm2-mapspam-results
          run-id: ${{ steps.mapspam.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: .public-mapspam
      - name: Build public MAPSPAM 2020 district and province reference
        if: steps.mapspam.outputs.available == 'true'
        run: |
          python scripts/build_public_mapspam.py \
            --input-dir .public-mapspam \
            --boundaries-dir docs/data/boundaries \
            --html docs/index.html \
            --output docs/data/mapspam/UZB_MAPSPAM_2020_ADM1_ADM2.json
      - name: Persist deterministic MAPSPAM snapshot in repository
        if: steps.mapspam.outputs.available == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/mapspam/UZB_MAPSPAM_2020_ADM1_ADM2.json
          if git diff --cached --quiet; then
            echo "MAPSPAM public snapshot is unchanged."
          else
            git commit -m "Update verified public MAPSPAM 2020 snapshot"
            git push origin HEAD:main
          fi
      - name: Check Python build scripts
        run: python -m py_compile scripts/build_public_boundaries.py scripts/build_public_mapspam.py scripts/check_public_site.py
      - name: Check public dashboard and JavaScript
        run: python scripts/check_public_site.py
      - name: Upload static demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
