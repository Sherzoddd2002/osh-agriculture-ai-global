name: Public dashboard pull-request QA

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/static-demo.html"
      - "docs/index.html"
      - "docs/ui-refresh.css"
      - ".github/workflows/demo-gif.yml"
      - "scripts/assemble_public_frontend.py"
      - "scripts/test_public_static_demo.mjs"
      - "scripts/export_public_mapspam_global.py"
      - "scripts/verify_public_mapspam_export.py"
      - "tests/test_public_mapspam_export.py"
      - ".github/workflows/installer-validation.yml"
      - "ops/export-public-mapspam.ps1"
      - "docs/PUBLIC_MAPSPAM_EXPORT.md"
      - ".github/workflows/public-demo-check.yml"

permissions:
  contents: read

jobs:
  static-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Assemble GitHub Pages homepage
        run: python scripts/assemble_public_frontend.py
      - name: Verify browser JavaScript and public controls
        run: node scripts/test_public_static_demo.mjs
      - name: Compile local MAPSPAM publisher and verifier
        run: python -m py_compile scripts/export_public_mapspam_global.py scripts/verify_public_mapspam_export.py
      - name: Install regression-test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Test Uzbekistan ADM2 preservation
        run: python -m pytest -q tests/test_public_mapspam_export.py
